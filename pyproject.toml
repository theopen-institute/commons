[project]
name = "commons"
authors = [
    { name = "Peter", email = "pgraif@gmail.com"}
]
description = "Shared tools for Frappe"
requires-python = ">=3.14"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # "frappe~=16.0.0" # Installed and managed by bench.
    # `commons.commons_core.jinja.make_qr_code`. The `pil` extra is what pulls in Pillow,
    # which `qrcode.make()` needs for its default image factory; Frappe happens
    # to install Pillow too, but this app is what requires it here.
    "qrcode[pil]",
    # `commons.api_integrations.claude`, which reads scanned documents for
    # `commons.document_capture`. 1.x is the major line the code is written
    # against (`httpx2` underneath, server-side fallbacks on the beta API).
    "anthropic>=1.8,<2",
    # `commons.email_extensions.mjml`, which compiles an Email Template's MJML
    # into the responsive HTML that is sent. A Rust port of MJML with Python
    # bindings, so the server needs no Node. 0.2 is the API the code calls
    # (`to_html` returning an `Output` with `.content` and `.warnings`).
    "mrml>=0.2.4,<0.3",
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

# Frappe Cloud uses this to pick a compatible Frappe version when installing the app
[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"
# ERPNext and HRMS are optional and so are not listed. Procurement needs
# erpnext>=16.0.0,<17.0.0 and leave and expenses need hrms>=16.0.0,<17.0.0; a
# site that wants those sections installs them alongside, and a site that does
# not gets this app without them rather than not at all. See `commons.core.apps`.

# These dependencies are only installed when developer mode is enabled
[tool.bench.dev-dependencies]
# package_name = "~=1.1.0"

# These apt dependencies will be installed from Ubuntu repositories when you host your app on Frappe Cloud
[deploy.dependencies.apt]
packages = []

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "UP",
    "B",
    "RUF",
]
ignore = [
    "B017", # assertRaises(Exception) - should be more specific
    "B018", # useless expression, not assigned to anything
    "B023", # function doesn't bind loop variable - will have last iteration's value
    "B904", # raise inside except without from
    "E101", # indentation contains mixed spaces and tabs
    "E402", # module level import not at top of file
    "E501", # line too long
    "E741", # ambiguous variable name
    "F401", # "unused" imports
    "F403", # can't detect undefined names from * import
    "F405", # can't detect undefined names from * import
    "F722", # syntax error in forward type annotation
    "W191", # indentation contains tabs
    "UP030", # Use implicit references for positional format fields (translations)
    "UP031", # Use format specifiers instead of percent format
    "UP032", # Use f-string instead of `format` call (translations)
    "UP037", # quoted annotations
    "UP040", # Use type aliases instead of type annotations
]
typing-modules = ["frappe.types.DF"]

[tool.ruff.lint.per-file-ignores]
# These read bank statements, so non-ASCII minus signs and spaces are the point.
"commons/banking/statement_import.py" = ["RUF001", "RUF002"]
"commons/banking/test_statement_import.py" = ["RUF001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true
