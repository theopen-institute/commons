     Two arrows passing each other, for the Transactions sidebar: money going
     out and coming in, which is what its payments, invoices and journal
     entries all record. A coin or a banknote would say "money" but not
     "movement", and would sit too close to the wallet beside it.

     Same tile, colour and stroke as students.svg, which says why the desk's
     container and this app's glyph idiom are both used here.
-->
