<svg width="54" height="54" viewBox="0 0 54 54" fill="none" xmlns="http://www.w3.org/2000/svg">
<!--
     Someone joining: a figure with a plus beside it. Admission is the moment a
     person is added to the roll, and that is the one thing every other reading
     of the word does not share.

     Four other ideas were drawn and thrown away. A doorway with an arrow
     through it is the sign-in glyph everywhere else on the web. A gateway arch
     repeats the silhouette of this app's own schoolhouse mark. A mortarboard
     with a plus is students again at any size a sidebar renders. An
     application form is a third paper rectangle next to courses and
     assessments, and the three stop telling each other apart at 32px.

     Same tile, colour and stroke as students.svg, which says why the desk's
     container and this app's glyph idiom are both used here.
-->
<path d="M38.5714 0H15.4286C6.90761 0 0 6.90761 0 15.4286V38.5714C0 47.0924 6.90761 54 15.4286 54H38.5714C47.0924 54 54 47.0924 54 38.5714V15.4286C54 6.90761 47.0924 0 38.5714 0Z" fill="#184a83" fill-opacity="0.12"/>
<circle cx="23" cy="19.5" r="5.5" stroke="#154173" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M12 37.5C12 31.4 16.9 29 23 29C26 29 28.8 29.6 31 30.8" stroke="#154173" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
