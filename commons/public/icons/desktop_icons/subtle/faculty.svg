<svg width="54" height="54" viewBox="0 0 54 54" fill="none" xmlns="http://www.w3.org/2000/svg">
<!--
     Someone standing behind a lectern: head, shoulders, and the panel that
     crops them. Three shapes rather than two because the panel on its own was
     a trophy, and a board on a stand, which was the next idea, is already
     ERPNext's Projects glyph at almost the same size and weight.

     A figure at all, when Users and Employees are both figures, works only
     because the lectern carries the meaning. The person is what stops the
     lectern reading as furniture; the lectern is what stops the person
     reading as one more user.

     Same tile, colour and stroke as students.svg, which says why the desk's
     container and this app's glyph idiom are both used here.
-->
